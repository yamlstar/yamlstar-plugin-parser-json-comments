- name: Native default after linking the adapter
  input: |
    a: true // comment
  flags: [-j]
  want: |
    {"a":"true // comment"}
- name: JSON comments selected by flag
  input: |
    a: true // comment
  flags: [--plugin=yaml-parser=json-comments, -j]
  want: |
    {"a":true}
- name: JSON comments selected by config
  input: |
    a: true // comment
  flags: [-j]
  config: |
    plugin:
      yaml-parser: json-comments
  want: |
    {"a":true}
- name: Events use the selected event source
  input: |
    true// comment
  flags: [--plugin=yaml-parser=json-comments, -e]
  want: |
    - {event: STREAM-START, encoding: UTF-8}
    - {event: DOCUMENT-START, implicit: true}
    - {event: SCALAR, value: true, implicit: true, quoted-implicit: false}
    - {event: DOCUMENT-END, implicit: true}
    - {event: STREAM-END}
- name: No invented event positions
  input: |
    true// comment
  flags: [--plugin=yaml-parser=json-comments, -E]
  want: |
    - {event: STREAM-START, encoding: UTF-8}
    - {event: DOCUMENT-START, implicit: true}
    - {event: SCALAR, value: true, style: Plain, implicit: true, quoted-implicit: false}
    - {event: DOCUMENT-END, implicit: true}
    - {event: STREAM-END}
- name: YAML output
  input: |
    a: true // comment
  flags: [--plugin=yaml-parser=json-comments, -y]
  want: |
    a: true
- name: Multiple documents
  input: |
    --- true// first
    --- false
  flags: [--plugin=yaml-parser=json-comments, -j]
  want: |
    true
    false
- name: Token mode rejects parser plugins
  input: |
    true// comment
  flags: [--plugin=yaml-parser=json-comments, -t]
  error: parser plugins are not supported
- name: Legacy mode rejects parser plugins
  input: |
    true// comment
  flags: [--plugin=yaml-parser=json-comments, -j, --unmarshal]
  error: parser plugins are not supported
- name: Node output uses the parser
  input: |
    a: true // comment
  flags: [--plugin=yaml-parser=json-comments, -n]
  want: |
    mapping:
    - plain: a
    - plain: 'true'
- name: Runtime flag overrides configuration
  input: |
    a: true // comment
  flags: [--plugin=yaml-parser=json-comments, -j]
  config: |
    plugin:
      yaml-parser: go-yaml
  want: |
    {"a":true}
- name: Requested version must match
  input: |
    true// comment
  flags: [--plugin=yaml-parser=json-comments@v0.0.1, -j]
  error: version mismatch
- name: Loader limits apply to parser events
  input: |
    [[[0]]] // comment
  flags: [-j]
  config: |
    plugin:
      yaml-parser: json-comments
      loader-limits:
        depth: 2
  error: depth
